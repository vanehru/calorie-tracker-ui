name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: self-hosted
    env:
      SKIP_DOCKER: ${{ inputs.skip-docker || false }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run build
      run: npm run build

    - name: Set up Docker Buildx
      if: env.SKIP_DOCKER == 'false'
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      if: env.SKIP_DOCKER == 'false'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      if: env.SKIP_DOCKER == 'false'
      uses: docker/build-push-action@v4
      with:
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/calorie-tracker-ui:${{ github.ref_name == 'main' && 'main' || 'dev' }}-${{ github.run_number }}
